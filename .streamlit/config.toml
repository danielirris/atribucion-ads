# Configuración de Streamlit para correr detrás del proxy de EasyPanel
[server]
headless = true
address = "0.0.0.0"
port = 8501
# Detrás de un reverse proxy con un solo dominio: desactivar CORS/XSRF evita
# problemas de websocket y de subida de archivos.
enableCORS = false
enableXsrfProtection = false
# Subir Excels de hasta 50 MB
maxUploadSize = 50
# Servir archivos estáticos de la carpeta ./static (para las páginas legales,
# accesibles en /app/static/<archivo> sin pasar por la contraseña).
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
# El tema real lo controla el CSS por variables (?theme=light|dark que manda
# Datibot). Aquí dejamos la base CLARA (el default de Datibot / caso común).
base = "light"
primaryColor = "#D7FF3A"
backgroundColor = "#F3F1EC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#18181B"
font = "sans serif"
