# Configuración de Streamlit para correr detrás del proxy de EasyPanel
[server]
headless = true
address = "0.0.0.0"
port = 8501
# Detrás de un reverse proxy con un solo dominio: desactivar CORS/XSRF evita
# problemas de websocket y de subida de archivos.
enableCORS = false
enableXsrfProtection = false
# Subir Excels de hasta 50 MB
maxUploadSize = 50
# Servir archivos estáticos de la carpeta ./static (para las páginas legales,
# accesibles en /app/static/<archivo> sin pasar por la contraseña).
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#3b82f6"
